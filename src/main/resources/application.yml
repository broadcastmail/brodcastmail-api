spring:
  datasource:
    url: jdbc:postgresql://${PGBOUNCER_HOST:${PGHOST}}:${PGBOUNCER_PORT:${PGPORT}}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    user: ${PGUSER}
    password: ${PGPASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  datasource:
    direct:
      url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
      username: ${PGUSER}
      password: ${PGPASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 2
        pool-name: direct-pool
  encryption:
    key: ${ENCRYPTION_KEY}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  unsubscribeSecret: ${UNSUBSCRIBE_SECRET}
  resend:
    webhook-base-url: ${RESEND_WEBHOOK_BASE_URL}

supabase:
  oauth:
    client-id: ${SUPABASE_CLIENT_ID}
    client-secret: ${SUPABASE_CLIENT_SECRET}
    redirect-uri: ${SUPABASE_REDIRECT_URI}
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  monthly-price-id: ${STRIPE_MONTHLY_PRICE_ID}
  yearly-price-id: ${STRIPE_YEARLY_PRICE_ID}




spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  encryption:
    key: ${ENCRYPTION_KEY}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  resend:
    webhook-base-url: ${RESEND_WEBHOOK_BASE_URL}

supabase:
  oauth:
    client-id: ${SUPABASE_CLIENT_ID}
    client-secret: ${SUPABASE_CLIENT_SECRET}
    redirect-uri: ${SUPABASE_REDIRECT_URI}



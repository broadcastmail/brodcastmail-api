spring:
  config:
    import: optional:classpath:sentry-release.properties
  datasource:
    url: jdbc:postgresql://${PGBOUNCER_HOST:${PGHOST}}:${PGBOUNCER_PORT:${PGPORT}}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    user: ${PGUSER}
    password: ${PGPASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  datasource:
    direct:
      url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
      username: ${PGUSER}
      password: ${PGPASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 2
        pool-name: direct-pool
  encryption:
    key: ${ENCRYPTION_KEY}
  frontend:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}
    oauth-callback-path: /api/v1/oauth/supabase/callback
    unsubscribe-redirect-url: ${UNSUBSCRIBE_REDIRECT_URL:http://localhost:3000}
    cookie-domain: ${APP_COOKIE_DOMAIN:}
  unsubscribeSecret: ${UNSUBSCRIBE_SECRET}
  resend:
    webhook-base-url: ${RESEND_WEBHOOK_BASE_URL}
  feedback:
    resend-api-key: ${FEEDBACK_RESEND_API_KEY:}
    from: ${FEEDBACK_FROM:}
    to: ${FEEDBACK_TO:}
    turnstile-secret: ${TURNSTILE_SECRET_KEY:}
  # header Cloudflare adds to every proxied request; unset = check off (PRELAUNCH §7)
  origin-secret: ${ORIGIN_SECRET:}
  rate-limit:
    # true only once the origin accepts nothing but Cloudflare (PRELAUNCH §7); otherwise the header can be spoofed
    trust-cf-connecting-ip: ${RATE_LIMIT_TRUST_CF_CONNECTING_IP:false}
  # e2e account ids, comma-separated; their errors are deliberate and not sent to Sentry
  sentry-ignored-account-ids: ${SENTRY_IGNORED_ACCOUNT_IDS:}

supabase:
  oauth:
    client-id: ${SUPABASE_CLIENT_ID}
    client-secret: ${SUPABASE_CLIENT_SECRET}
    redirect-uri: ${SUPABASE_REDIRECT_URI:http://localhost:3000/api/oauth/callback}
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  monthly-price-id: ${STRIPE_MONTHLY_PRICE_ID}
  yearly-price-id: ${STRIPE_YEARLY_PRICE_ID}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: production
  tags:
    service: api
